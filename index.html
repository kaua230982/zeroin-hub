<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZeroIn Hub</title>

    <meta
        name="description"
        content="ZeroIn Hub - Script oficial"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <main class="container">

        <div class="status">
            <span class="status-dot"></span>
            CONTEÚDO DISPONÍVEL
        </div>

        <h1>
            ZeroIn <span>Hub</span>
        </h1>

        <p class="subtitle">
            Seu script está disponível abaixo.
        </p>

        <section class="script-card">

            <div class="card-header">

                <div>
                    <div class="small-title">SCRIPT</div>
                    <h2>ZeroIn Hub</h2>
                </div>

                <div class="version">
                    v1.0
                </div>

            </div>

            <div class="code-box">

                <div class="code-header">

                    <div class="window-buttons">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="language">
                        LUA
                    </div>

                </div>

                <pre><code id="scriptCode">loadstring(game:HttpGet("https://zeroinhub.com/api/script"))()</code></pre>

            </div>

            <button id="copyButton">
                <span id="buttonText">COPIAR SCRIPT</span>
            </button>

            <div id="message"></div>

        </section>

        <div class="features">

            <div class="feature">
                <span>✓</span>
                Script atualizado
            </div>

            <div class="feature">
                <span>✓</span>
                Página oficial
            </div>

            <div class="feature">
                <span>✓</span>
                Compatível com celular
            </div>

        </div>

        <footer>
            © 2026 ZeroIn Hub
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
